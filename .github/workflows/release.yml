name: Release

on:
  push:
    branches: [ main ]
    paths:
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. 每个平台构建一个单文件可执行程序（Windows exe / Linux ELF）
  # Linux 固定用 22.04（glibc 2.35）以兼容更老的发行版；ubuntu-latest 是 24.04，
  # 打出来的包要求 GLIBC_2.38，在 22.04 上直接启动失败。
  binaries:
    name: binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-22.04 ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 版本号唯一来源是 CHANGELOG.md，注入到 lspy.py（打进二进制里的常量）
      - name: Sync version from CHANGELOG
        run: python scripts/sync_version.py

      # Windows runner 自带 tkinter；Linux runner 需要单独装，装不上也不阻塞（脚本会自动跳过）
      - name: Install tkinter (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk || echo "python3-tk unavailable, building without a file picker"

      - name: Build single-file executable
        run: |
          python -m pip install --upgrade pip pyinstaller
          python scripts/build_binary.py --clean

      - name: Show artifacts
        run: python -c "import os,glob;[print(os.path.basename(p), round(os.path.getsize(p)/1048576,1),'MiB') for p in glob.glob('dist/*')]"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # 2. 构建 wheel / sdist
  package:
    name: package (wheel + sdist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync version from CHANGELOG
        run: python scripts/sync_version.py

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # 3. 汇总全部产物，打 tag 并发布 Release
  release:
    name: publish release
    needs: [ binaries, package ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Read version and notes from CHANGELOG
        id: version
        run: |
          python scripts/extract_release_notes.py
          echo "version=$(cat .release_version)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -l dist

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping tag creation"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "lspy $TAG"
            git push origin "$TAG"
          fi
          gh release create "$TAG" dist/* \
            --title "lspy ${{ steps.version.outputs.version }}" \
            --notes-file .release_notes.md \
            --latest
