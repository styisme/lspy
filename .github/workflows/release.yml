name: Release

on:
  push:
    branches: [ main, master ]
    paths:
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 1. 版本号唯一来源是 CHANGELOG.md；注入到 lspy.py 与 pyproject.toml
      - name: Sync version from CHANGELOG
        id: version
        run: |
          python scripts/sync_version.py
          python scripts/extract_release_notes.py
          echo "version=$(cat .release_version)" >> "$GITHUB_OUTPUT"

      # 2. 构建 sdist / wheel
      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # 3. 打 Tag 并发布 Release
      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping tag creation"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "lspy $TAG"
            git push origin "$TAG"
          fi
          gh release create "$TAG" dist/* \
            --title "lspy ${{ steps.version.outputs.version }}" \
            --notes-file .release_notes.md \
            --latest
