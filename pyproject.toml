[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lspy"
version = "1.27.1"
description = "LocalSend-compatible Python CLI for LAN and cross-network file transfer"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "styisme" }]
keywords = ["localsend", "file-transfer", "lan", "cli"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
binary = ["pyinstaller>=6.0"]

[project.urls]
Homepage = "https://github.com/styisme/lspy"
Repository = "https://github.com/styisme/lspy"
Issues = "https://github.com/styisme/lspy/issues"
Changelog = "https://github.com/styisme/lspy/blob/main/CHANGELOG.md"
AI-Disclosure = "https://github.com/styisme/lspy/blob/main/docs/AI_DISCLOSURE.md"

[project.scripts]
lspy = "lspy:main"

[tool.setuptools]
py-modules = ["lspy", "cfdialog"]
